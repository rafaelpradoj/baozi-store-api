# Identificacao da aplicacao
spring.application.name=baozi-store-api
server.port=8080

# Conexao com o MySQL no Podman (permite sobrescrita via variaveis de ambiente)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/baozi_store?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:baozi_app}
spring.datasource.password=${DB_PASS:AppBaozi@2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate (o dialeto MySQL 8+ e detectado automaticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Respostas de erro legiveis em JSON
server.error.include-message=always
